<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Reset Password</title>
    <style>
      body { font-family: Arial, sans-serif; padding: 2rem; max-width: 520px; margin: auto; }
      label { display:block; margin-bottom:8px; }
      input[type=password]{ width:100%; padding:8px; margin-bottom:12px }
      button{ padding:10px 14px }
      .msg{ margin-top:12px }
    </style>
  </head>
  <body>
    <h1>Reset your password</h1>
    <form id="resetForm">
      <label for="newPassword">New password</label>
      <input id="newPassword" name="new_password" type="password" required minlength="8" />
      <input id="token" name="token" type="hidden" />
      <button type="submit">Set new password</button>
    </form>
    <div class="msg" id="message"></div>

    <script>
      // Extract token from URL and populate hidden field
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');
      if (!token) {
        document.getElementById('message').textContent = 'No reset token provided in URL.';
        document.getElementById('resetForm').style.display = 'none';
      } else {
        document.getElementById('token').value = token;
      }

      document.getElementById('resetForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const newPassword = document.getElementById('newPassword').value;
        const tokenVal = document.getElementById('token').value;
        document.getElementById('message').textContent = 'Submitting...';
        try {
          const res = await fetch('/api/v1/auth/update-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: tokenVal, new_password: newPassword }),
          });
          const data = await res.json();
          if (!res.ok) {
            document.getElementById('message').textContent = data.detail || data.message || 'Reset failed';
            return;
          }
          document.getElementById('message').textContent = data.message || 'Password reset successfully';
          document.getElementById('resetForm').reset();
        } catch (err) {
          document.getElementById('message').textContent = 'Network error';
        }
      });
    </script>
  </body>
</html>
